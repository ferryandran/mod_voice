plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.voicedoor'
archivesBaseName = 'voicedoor'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'voicedoor'
            mods {
                voicedoor {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'voicedoor'
            mods {
                voicedoor {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'voicedoor', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                voicedoor {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Repo resmi Max Henkel menyediakan voicechat-api tanpa autentikasi apa pun.
    //
    // Versi sebelumnya juga mendaftarkan maven.pkg.github.com beserta personal access
    // token yang ditulis langsung di file ini, dengan huruf pertamanya disamarkan sebagai
    // escape unicode supaya lolos dari secret scanning GitHub. Blok itu dihapus: repo di
    // bawah sudah cukup untuk voicechat-api, dan kredensial tidak pernah boleh berada di
    // file yang di-commit. Kalau suatu saat memang perlu, taruh di
    // ~/.gradle/gradle.properties atau variabel lingkungan, lalu baca lewat
    // project.findProperty('namaProperti').
    maven {
        name = 'MaxHenkel'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup 'de.maxhenkel.voicechat'
        }
    }

    // Maven Modrinth menyediakan jar mod Simple Voice Chat yang lengkap. Maven Max Henkel
    // hanya mem-publish voicechat-api (cukup untuk compile, tapi tidak bisa dijalankan),
    // jadi repo ini dibutuhkan untuk runClient.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // Compile hanya terhadap API-nya. Ini sudah benar: implementasinya datang dari mod
    // voicechat saat runtime, bukan dibundel ke jar kita.
    compileOnly(fg.deobf("de.maxhenkel.voicechat:voicechat-api:2.5.0"))

    // Mod Simple Voice Chat yang lengkap, HANYA untuk runClient/runServer.
    //
    // Kenapa lewat Gradle dan bukan ditaruh manual di run/mods/: jar rilisnya memakai nama
    // SRG (ter-obfuscate), sementara dev environment ini memakai mapping 'official'.
    // Menaruhnya langsung membuat voicechat crash saat start dengan
    //   NoSuchMethodError: net.minecraft.client.Minecraft.m_91087_()
    // yaitu nama SRG untuk Minecraft.getInstance(). fg.deobf() meremap jar itu ke mapping
    // official lebih dulu, sehingga bisa jalan di dev.
    //
    // Di Minecraft sungguhan sebaliknya: pasang jar rilis voicechat seperti biasa, karena
    // runtime produksi memang memakai nama SRG.
    runtimeOnly fg.deobf("maven.modrinth:simple-voice-chat:forge-1.20.1-2.6.23")
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "voicedoor",
            "Specification-Vendor"    : "voicedoor",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.jar.archiveVersion,
            "Implementation-Vendor"   : "voicedoor",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
